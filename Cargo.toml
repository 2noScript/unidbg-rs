[workspace]
resolver = "2"
members = [
    "crates/unidbg-api",
    "crates/unidbg-android",
    "crates/unidbg-ios",
    "crates/unidbg-cli",
    "backend/unicorn2",
    "backend/dynarmic",
    "backend/hypervisor",
    "backend/kvm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/2noScript/unidbg-rs"
homepage = "https://github.com/2noScript/unidbg-rs"
keywords = ["unidbg", "arm64", "android", "ios", "emulator"]
categories = ["emulators", "development-tools::debugging"]

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
bitflags = "2.6"
bytes = "1.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rangemap = "1.5"
goblin = "0.9"
capstone = "0.12"
keystone-engine = { version = "0.1", features = ["build-from-src"] }
unicorn-engine = { version = "2.1", default-features = false, features = ["arch_arm", "arch_aarch64"] }
clap = { version = "4.5", features = ["derive"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
plist = "1.7"
cpp_demangle = "0.4"
